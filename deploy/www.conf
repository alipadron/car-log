; car-log php-fpm pool — single pool, listens on localhost:9000 (nginx upstream).
; clear_env = no is essential: it keeps the container's environment variables
; (APP_KEY, CAR_LOG_UNLOCK_PASSWORD, ...) visible to Laravel. The default is
; "yes", which would silently empty every env var for fpm workers.

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5

clear_env = no

catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2