# car-log nginx config — single server block serving the PWA and the API.
# Static files (the built PWA) come from the Laravel public dir; /api and /up
# are handed to php-fpm via the Laravel front controller.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.html;

    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Laravel health check and API routes → front controller.
    location ~ ^/(api|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    # The Laravel front controller.
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_hide_header X-Powered-By;
    }

    # Serve the built PWA. Any non-API path that isn't a real file falls back
    # to index.html so Angular client-side routes work on refresh/deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never execute stray PHP files.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}