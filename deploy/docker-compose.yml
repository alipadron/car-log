# car-log on the home PC: app (nginx + php-fpm, one image) + Cloudflare Tunnel.
#
# Values in ${...} come from deploy/.env — copy deploy/.env.example or run
# deploy/setup.ps1 (the wizard) which creates it.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: car-log:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY in deploy/.env}
      APP_URL: https://${CAR_LOG_SUBDOMAIN:?set CAR_LOG_SUBDOMAIN in deploy/.env}.alipadron.dev
      CAR_LOG_UNLOCK_PASSWORD: ${CAR_LOG_UNLOCK_PASSWORD:?set CAR_LOG_UNLOCK_PASSWORD in deploy/.env}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/data/database.sqlite
      LOG_CHANNEL: stack
      LOG_STACK: single
    volumes:
      # The whole database is one SQLite file. It lives on a Docker named
      # volume mounted at a dedicated /var/www/html/data dir — NOT over the
      # whole database/ dir — so the image's migrations stay visible and image
      # updates propagate new migrations.
      #
      # Named volume by default: on Windows (Docker Desktop / WSL2) the volume
      # is ext4 inside the VM, so SQLite's file locking behaves. SQLite over a
      # Windows NTFS bind mount is unreliable — keep this a named volume unless
      # you're on Linux and want a directly-copyable file, in which case set
      # CAR_LOG_DATA_VOLUME=./data in deploy/.env (backup = cp ./data/database.sqlite).
      - ${CAR_LOG_DATA_VOLUME:-carlog-data}:/var/www/html/data
    healthcheck:
      # Hit Laravel's /up (HTTP stack alive) AND read the SQLite file on the
      # mounted volume, so a broken/unwritable database surfaces as unhealthy.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up && php -r 'exit((new PDO(\"sqlite:/var/www/html/data/database.sqlite\"))->query(\"select 1\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in deploy/.env}
    # Share the app's network namespace so the tunnel's public hostname can
    # point at http://localhost:80 (the Cloudflare dashboard default).
    network_mode: "service:app"
    depends_on:
      - app

volumes:
  carlog-data: