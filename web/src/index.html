<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Web</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Apply the stored theme before first paint to avoid a light flash.
       Must stay in sync with THEME_STORAGE_KEY in src/app/theme.ts. -->
  <script>
    try {
      var storedTheme = localStorage.getItem('car-log.theme');
      if (
        storedTheme === 'dark' ||
        (storedTheme === null && matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark');
      }
    } catch {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
