<main class="mx-auto mt-[15vh] w-full max-w-md px-4">
  <form class="flex flex-col gap-3" (submit)="unlock(); $event.preventDefault()">
    <label hlmLabel for="password">Password</label>
    <input
      hlmInput
      id="password"
      type="password"
      autocomplete="current-password"
      autofocus
      [formField]="unlockForm.password"
    />

    @if (unlockForm.password().touched() && unlockForm.password().invalid()) {
      <p class="text-destructive text-sm" role="alert">
        {{ unlockForm.password().errors()[0]?.message }}
      </p>
    }

    @if (error()) {
      <p class="text-destructive text-sm" role="alert">{{ error() }}</p>
    }

    <button hlmBtn type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Unlocking…' : 'Unlock' }}
    </button>
  </form>
</main>
