<header class="mx-auto flex w-full max-w-md items-center justify-between px-4 pt-4">
  <h1 class="text-2xl font-bold">car-log</h1>
  <button
    hlmBtn
    variant="ghost"
    size="icon"
    type="button"
    [attr.aria-label]="theme.dark() ? 'Switch to light mode' : 'Switch to dark mode'"
    (click)="theme.toggle()"
  >
    @if (theme.dark()) {
      <!-- Lucide: sun -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="size-5"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2" />
        <path d="M12 20v2" />
        <path d="m4.93 4.93 1.41 1.41" />
        <path d="m17.66 17.66 1.41 1.41" />
        <path d="M2 12h2" />
        <path d="M20 12h2" />
        <path d="m6.34 17.66-1.41 1.41" />
        <path d="m19.07 4.93-1.41 1.41" />
      </svg>
    } @else {
      <!-- Lucide: moon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="size-5"
        aria-hidden="true"
      >
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
    }
  </button>
</header>

@if (auth.token()) {
  <main class="mx-auto w-full max-w-md px-4 py-8">
    <app-vehicles />
  </main>
} @else {
  <app-unlock />
}
