<header class="mx-auto flex w-full max-w-md items-center justify-between px-4 pt-4">
  <h1 class="text-2xl font-bold">car-log</h1>
  <button
    hlmBtn
    variant="ghost"
    size="icon"
    type="button"
    [attr.aria-label]="theme.dark() ? i18n.t()('theme.light') : i18n.t()('theme.dark')"
    (click)="theme.toggle()"
  >
    @if (theme.dark()) {
      <!-- Lucide: sun -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="size-5"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2" />
        <path d="M12 20v2" />
        <path d="m4.93 4.93 1.41 1.41" />
        <path d="m17.66 17.66 1.41 1.41" />
        <path d="M2 12h2" />
        <path d="M20 12h2" />
        <path d="m6.34 17.66-1.41 1.41" />
        <path d="m19.07 4.93-1.41 1.41" />
      </svg>
    } @else {
      <!-- Lucide: moon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="size-5"
        aria-hidden="true"
      >
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
    }
  </button>
</header>

@if (auth.token()) {
  @if (connectivity.unreachable()) {
    <hlm-alert variant="destructive" class="mx-auto mt-4 w-full max-w-md">
      <!-- Lucide: wifi-off -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 20h.01" />
        <path d="M8.5 16.429a5 5 0 0 1 7 0" />
        <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
        <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
        <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
        <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
        <path d="m2 2 20 20" />
      </svg>
      <h4 hlmAlertTitle>{{ i18n.t()('offline.banner.title') }}</h4>
      <p hlmAlertDescription>{{ i18n.t()('offline.banner.description') }}</p>
    </hlm-alert>
  }
  <nav class="mx-auto flex w-full max-w-md gap-2 px-4 pt-4">
    <button
      hlmBtn
      variant="ghost"
      type="button"
      class="flex-1"
      [class.bg-accent]="activeView() === 'home'"
      (click)="activeView.set('home'); selectedVehicle.set(null)"
    >
      {{ i18n.t()('nav.home') }}
    </button>
    <button
      hlmBtn
      variant="ghost"
      type="button"
      class="flex-1"
      [class.bg-accent]="activeView() === 'vehicles'"
      (click)="activeView.set('vehicles'); selectedVehicle.set(null)"
    >
      {{ i18n.t()('nav.vehicles') }}
    </button>
    <button
      hlmBtn
      variant="ghost"
      type="button"
      class="flex-1"
      [class.bg-accent]="activeView() === 'settings'"
      (click)="activeView.set('settings'); selectedVehicle.set(null)"
    >
      {{ i18n.t()('nav.settings') }}
    </button>
  </nav>
  <main class="mx-auto w-full max-w-md px-4 py-8">
    @if (selectedVehicle()) {
      <app-vehicle-detail
        [vehicle]="selectedVehicle()!"
        (back)="selectedVehicle.set(null)"
      />
    } @else if (activeView() === 'home') {
      <app-home />
    } @else if (activeView() === 'vehicles') {
      <app-vehicles (viewVehicle)="selectedVehicle.set($event)" />
    } @else {
      <app-settings-form />
    }
  </main>
} @else {
  <app-unlock />
}
